[pytest]
# Behavior evals hit a real (cheap, OpenRouter) model and need
# $OPENROUTER_API_KEY. They are opt-in: a bare `pytest` (and CI)
# deselects them via the default marker filter; run them explicitly
# with `pytest -m eval`.
addopts = -m "not eval"
markers =
    eval: real-model behavior eval (opt-in; needs OPENROUTER_API_KEY)
