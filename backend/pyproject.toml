[project]
name = "life-assistant-backend"
version = "0.0.0"
description = "Life Assistant backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pydantic-ai-slim[openai,ui]>=1.0",
    # Was transitive via the full pydantic-ai meta-package; slim drops it.
    # FastAPI needs it for multipart/form parsing (e.g. voice upload).
    "python-multipart>=0.0.9",
    "langfuse>=3.0",
    "bcrypt>=4.0",
    "itsdangerous>=2.2",
    "pywebpush>=2.0",
    "cryptography>=42",
    "sentry-sdk[fastapi]>=2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
