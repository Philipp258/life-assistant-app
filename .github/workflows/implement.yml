name: Implement

run-name: "Implement: ${{ inputs.instruction }}"

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: "Free-text implementation instruction, e.g. 'implement issue 84' or 'fix CI on PR 83'"
        required: true
        type: string

concurrency:
  group: implement-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    timeout-minutes: 30
    env:
      ZAI_API_KEY: test-dummy-key
      IMPLEMENT_INSTRUCTION: ${{ inputs.instruction }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PROJECT_PAT }}

      - uses: astral-sh/setup-uv@v6

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            You are an implementation agent for the assistant-app repo.

            ## User instruction
            ${{ inputs.instruction }}

            ## How to work
            Interpret the free-text instruction and decide the right workflow:

            - If it names an issue, read it with `gh issue view <number> --json title,body,comments,state,url`.
            - If it names a PR, read it with `gh pr view <number> --json title,body,comments,reviews,files,headRefName,baseRefName,state,url` and inspect failing checks or requested changes as needed.
            - If it says to fix CI, inspect the relevant run/check logs with `gh pr checks`, `gh run view`, or the GitHub API.
            - If there is already an open PR for the requested issue, update that PR's branch instead of opening a duplicate.
            - If no PR exists and the task needs code changes, create a new branch and open a PR.
            - If the instruction is ambiguous or unsafe, do not guess: comment on the relevant issue/PR if one is clear, otherwise fail with a concise explanation.

            ## Implementation rules
            - Follow existing codebase patterns.
            - Keep the change focused on the instruction.
            - Do not merge PRs.
            - Do not create replacement PRs for review feedback; push fixes to the existing PR branch.
            - Use Conventional Commits (`feat:`, `fix:`, `ci:`, etc.).
            - Include `Closes #<issue>` in a new PR body when the work resolves an issue.

            ## Checks
            Before pushing, run the relevant checks for the files you changed. Prefer the full suite when feasible:

            - Backend: `cd backend && uv sync && uv run ruff check . && uv run ruff format --check . && uv run pytest && cd ..`
            - Frontend: `cd frontend && pnpm install --frozen-lockfile && pnpm typecheck && pnpm build && pnpm test && cd ..`

            If checks fail, fix the code and re-run them until they pass, or clearly explain why the failure is unrelated/not fixable in this run.

            ## Project layout
            - backend/ — Python/FastAPI, managed with uv
            - frontend/ — React/TypeScript, managed with pnpm
          claude_args: "--model claude-opus-4-7 --permission-mode bypassPermissions"
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
